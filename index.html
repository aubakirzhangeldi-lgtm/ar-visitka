<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Визитка Жангелды Аубакира</title>

<style>
body {
    margin: 0;
    padding: 30px 20px;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

.card {
    max-width: 450px;
    margin: auto;
}

h1 {
    font-size: 30px;
    margin-bottom: 10px;
}

.job {
    color: #aaa;
    font-size: 18px;
    margin-bottom: 30px;
}

.button {
    display: block;
    padding: 16px;
    margin: 12px 0;
    border-radius: 12px;
    text-decoration: none;
    font-size: 18px;
    font-weight: bold;
}

.phone {
    background: #25D366;
    color: white;
}

.instagram {
    background: #833AB4;
    color: white;
}

.qr {
    background: white;
    padding: 20px;
    margin-top: 35px;
    border-radius: 20px;
    color: black;
}

.qr img {
    width: 220px;
    height: 220px;
    max-width: 100%;
}
</style>

</head>

<body>

<div class="card">

<h1>Жангелды Аубакир</h1>

<div class="job">
Менеджер по продажам
</div>

<a class="button phone" href="tel:+77000000000">
📞 Позвонить
</a>

<a class="button instagram" href="https://instagram.com/" target="_blank">
📷 Instagram
</a>

<div class="qr">

<h2>Моя визитка</h2>

<img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https%3A%2F%2Faubakirzhangeldi-lgtm.github.io%2Far-visitka%2F">

<p>Наведите камеру телефона на QR-код</p>

</div>

</div>

</body>
</html>
