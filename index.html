<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Жангелды Аубакир — Визитка</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

.card {
    width: 100%;
    max-width: 500px;
    margin: auto;
    padding: 35px 20px 45px;
}


/* =========================
   ЛОГОТИП
========================= */

.logo {
    width: 180px;
    height: 180px;
    margin: 0 auto 25px;

    display: flex;
    align-items: center;
    justify-content: center;
}

.logo img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
}


/* =========================
   ИМЯ
========================= */

h1 {
    margin: 10px 0;
    font-size: 30px;
}

.job {
    color: #aaa;
    font-size: 18px;
    margin-bottom: 30px;
}


/* =========================
   КНОПКИ
========================= */

.button {
    display: block;
    width: 100%;

    padding: 17px;
    margin: 12px 0;

    border-radius: 14px;
    border: none;

    text-decoration: none;

    font-size: 18px;
    font-weight: bold;

    cursor: pointer;
}


/* Телефон */

.phone {
    background: #25D366;
    color: white;
}


/* WhatsApp */

.whatsapp {
    background: #128C7E;
    color: white;
}


/* Instagram */

.instagram {
    background: #833AB4;
    color: white;
}


/* AR */

.ar {
    background: white;
    color: black;
}


/* =========================
   QR-КОД
========================= */

.qr-box {
    margin-top: 35px;

    padding: 25px 15px;

    background: white;
    color: #111;

    border-radius: 20px;
}

.qr-box h2 {
    margin-top: 0;
}

.qr-box img {
    display: block;

    width: 220px;
    height: 220px;

    margin: 20px auto;
}

.qr-box p {
    margin-bottom: 0;

    color: #555;

    font-size: 14px;
}


/* =========================
   AR КАМЕРА
========================= */

#camera {
    display: none;

    position: fixed;

    inset: 0;

    background: black;

    z-index: 1000;
}


#camera video {
    width: 100%;
    height: 100%;

    object-fit: cover;
}


/* Логотип поверх камеры */

.ar-logo {
    position: absolute;

    width: 180px;
    height: 180px;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    display: flex;

    align-items: center;
    justify-content: center;
}

.ar-logo img {
    width: 100%;
    height: 100%;

    object-fit: contain;
}


/* Кнопка закрытия AR */

.close-ar {
    position: absolute;

    top: 25px;
    right: 20px;

    z-index: 1001;

    padding: 12px 18px;

    border: none;

    border-radius: 10px;

    background: white;

    color: black;

    font-size: 16px;

    font-weight: bold;
}


/* Текст AR */

.ar-text {
    position: absolute;

    bottom: 35px;

    left: 20px;
    right: 20px;

    color: white;

    background: rgba(0,0,0,0.6);

    padding: 12px;

    border-radius: 10px;

    font-size: 15px;
}

</style>

</head>

<body>

<div class="card">

```
<!-- =========================
     ЛОГОТИП
========================== -->

<div class="logo">

    <img
        src="logo.png"

<!-- =========================

<h1>

<!-- ДОЛЖНОСТЬ -->

<div class="job">

========================== -->

<a

<!-- =========================

<!-- =========================

<a

```

</div>

<!-- =========================
     AR КАМЕРА
========================= -->

<div id="camera">

```
<!-- Закрыть -->

<button
    class="close-ar"
    onclick="closeAR()"
>
    ✕ Закрыть
</button>


<!-- Камера -->

<video
    id="video"
    autoplay
    playsinline
></video>


<!-- Логотип -->

<div class="ar-logo">

    <img
        src="logo.png"
        alt="Логотип"
    >

</div>


<!-- Текст -->

<div class="ar-text">

    Логотип отображается поверх камеры

</div>
```

</div>

<script>

let stream = null;


/* =========================
   ОТКРЫТЬ КАМЕРУ
========================= */

async function startAR() {

    const camera =
        document.getElementById("camera");

    const video =
        document.getElementById("video");


    try {

        stream =
            await navigator.mediaDevices.getUserMedia({

                video: {
                    facingMode: {
                        ideal: "environment"
                    }
                },

                audio: false

            });


        video.srcObject = stream;

        camera.style.display = "block";


    } catch (error) {

        alert(
            "Не удалось открыть камеру. " +
            "Разрешите доступ к камере в браузере."
        );

    }

}


/* =========================
   ЗАКРЫТЬ КАМЕРУ
========================= */

function closeAR() {

    const camera =
        document.getElementById("camera");


    if (stream) {

        stream
            .getTracks()
            .forEach(function(track) {

                track.stop();

            });

        stream = null;

    }


    camera.style.display = "none";

}

</script>
