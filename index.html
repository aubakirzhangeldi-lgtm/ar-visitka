<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Визитка Жангелды Аубакира</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

.card {
    width: 100%;
    max-width: 500px;
    margin: auto;
    padding: 35px 20px 40px;
}

.logo {
    width: 130px;
    height: 130px;
    margin: 0 auto 25px;
    border-radius: 20px;
    background: white;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.logo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.logo-placeholder {
    color: #111;
    font-weight: bold;
}

h1 {
    margin: 10px 0;
    font-size: 30px;
}

.job {
    color: #aaa;
    font-size: 18px;
    margin-bottom: 30px;
}

.button {
    display: block;
    width: 100%;
    padding: 17px;
    margin: 12px 0;
    border-radius: 14px;
    text-decoration: none;
    font-size: 18px;
    font-weight: bold;
    border: none;
    cursor: pointer;
}

.phone {
    background: #25D366;
    color: white;
}

.whatsapp {
    background: #128C7E;
    color: white;
}

.instagram {
    background: #833AB4;
    color: white;
}

.ar {
    background: white;
    color: black;
}

.qr-box {
    margin-top: 35px;
    padding: 25px 15px;
    background: white;
    color: #111;
    border-radius: 20px;
}

.qr-box img {
    width: 220px;
    height: 220px;
    max-width: 100%;
}

.qr-box p {
    color: #555;
    margin-bottom: 0;
}

#camera {
    display: none;
    position: fixed;
    inset: 0;
    background: black;
    z-index: 1000;
}

#camera video {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.ar-logo {
    position: absolute;
    width: 180px;
    height: 180px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: white;
    border-radius: 20px;
    padding: 10px;
}

.ar-logo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.close-ar {
    position: absolute;
    top: 25px;
    right: 20px;
    z-index: 1001;
    padding: 12px 18px;
    border: none;
    border-radius: 10px;
    background: white;
    color: black;
    font-size: 16px;
    font-weight: bold;
}

.ar-text {
    position: absolute;
    bottom: 35px;
    left: 20px;
    right: 20px;
    color: white;
    background: rgba(0,0,0,0.6);
    padding: 12px;
    border-radius: 10px;
}
</style>

</head>

<body>

<div class="card">

```
<div class="logo">
    <img src="logo.png"
         alt="Логотип"
         onerror="this.style.display='none'; document.getElementById('placeholder').style.display='block';">

    <div id="placeholder" class="logo-placeholder">
        ЛОГОТИП
    </div>
</div>

<h1>Жангелды Аубакир</h1>

<div class="job">
    Менеджер по продажам
</div>

<a class="button phone"
   href="tel:+77066770667">
    📞 Позвонить
</a>

<a class="button whatsapp"
   href="https://wa.me/77066770667"
   target="_blank">
    💬 WhatsApp
</a>

<a class="button instagram"
   href="https://instagram.com/"
   target="_blank">
    📷 Instagram
</a>

<button class="button ar" onclick="startAR()">
    📱 Открыть AR
</button>

<div class="qr-box">

    <h2>Моя визитка</h2>

    <img
    src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=https%3A%2F%2Faubakirzhangeldi-lgtm.github.io%2Far-visitka%2F"
    alt="QR-код">

    <p>
        Отсканируйте QR-код камерой телефона
    </p>

</div>
```

</div>

<div id="camera">

```
<button class="close-ar" onclick="closeAR()">
    ✕ Закрыть
</button>

<video id="video" autoplay playsinline></video>

<div class="ar-logo">
    <img src="logo.png" alt="Логотип">
</div>

<div class="ar-text">
    Ваш логотип отображается поверх камеры
</div>
```

</div>

<script>

let stream = null;

async function startAR() {

    const camera = document.getElementById("camera");
    const video = document.getElementById("video");

    try {

        stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: {
                    ideal: "environment"
                }
            },
            audio: false
        });

        video.srcObject = stream;

        camera.style.display = "block";

    } catch (error) {

        alert("Разрешите доступ к камере в браузере.");

    }
}

function closeAR() {

    const camera = document.getElementById("camera");

    if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
    }

    camera.style.display = "none";
}

</script>

</body>
</html>
