<style>

}

body {

}

.job {

}


/* КНОПКИ */

.button {
    display: block;
    width: 100%;

    padding: 17px;
    margin: 12px 0;

    border-radius: 14px;
    border: none;

    text-decoration: none;

    font-size: 18px;
    font-weight: bold;

    cursor: pointer;
}

.phone {
    background: #25D366;
    color: white;
}

.whatsapp {
    background: #128C7E;
    color: white;
}

.instagram {
    background: #833AB4;
    color: white;
}

.ar {
    background: white;
    color: black;
}


/* QR */

.qr-box {
    margin-top: 35px;
    padding: 25px 15px;

    background: white;
    color: #111;

    border-radius: 20px;
}

.qr-box h2 {
    margin-top: 0;
}

.qr-box img {
    display: block;

    width: 220px;
    height: 220px;

    margin: 20px auto;
}

.qr-box p {
    color: #555;
    font-size: 14px;
}


/* =========================
   AR ЭКРАН
========================= */

#ar-screen {

    display: none;

    position: fixed;

    inset: 0;

    background: #000;

    z-index: 9999;
}


/* AR Canvas */

#ar-canvas {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;
}


/* Кнопка закрытия */

.close-ar {

    position: fixed;

    top: 20px;
    right: 20px;

    z-index: 10001;

    padding: 12px 18px;

    border: none;

    border-radius: 12px;

    background: white;

    color: black;

    font-size: 16px;

    font-weight: bold;

}


/* Инструкция */

.ar-help {

    position: fixed;

    bottom: 25px;

    left: 20px;
    right: 20px;

    z-index: 10001;

    padding: 14px;

    background: rgba(0,0,0,0.7);

    border-radius: 12px;

    color: white;

    font-size: 15px;

}


/* Сообщение */

#ar-message {

    position: fixed;

    top: 75px;

    left: 20px;
    right: 20px;

    z-index: 10002;

    padding: 14px;

    background: rgba(0,0,0,0.75);

    border-radius: 12px;

    font-size: 15px;

}

<!-- THREE.JS -->

<script
src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js">
</script>

<script>

let xrSession = null;

let renderer = null;

let scene = null;

let camera = null;

let controller = null;

let hitTestSource = null;

let hitTestSourceRequested = false;

let logoMesh = null;


/* =========================
   ОТКРЫТИЕ AR
========================= */

async function openAR() {

    if (!navigator.xr) {

        alert(
            "Этот телефон или браузер не поддерживает WebXR AR. " +
            "Попробуйте Android + Google Chrome."
        );

        return;
    }


    const supported =
        await navigator.xr.isSessionSupported("immersive-ar");


    if (!supported) {

        alert(
            "AR не поддерживается этим устройством. " +
            "Попробуйте Android-телефон с Chrome."
        );

        return;
    }


    document.getElementById("ar-screen").style.display = "block";


    /* THREE */

    scene = new THREE.Scene();


    camera = new THREE.PerspectiveCamera(
        70,
        window.innerWidth / window.innerHeight,
        0.01,
        20
    );


    renderer = new THREE.WebGLRenderer({

        canvas:
            document.getElementById("ar-canvas"),

        alpha: true,

        antialias: true

    });


    renderer.setPixelRatio(
        window.devicePixelRatio
    );


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );


    renderer.xr.enabled = true;


    /* СВЕТ */

    const light =
        new THREE.HemisphereLight(
            0xffffff,
            0xbbbbff,
            3
        );

    scene.add(light);


    /* ЛОГОТИП */

    const loader =
        new THREE.TextureLoader();


    loader.load(

        "logo.png",

        function(texture) {

            texture.colorSpace =
                THREE.SRGBColorSpace;


            const geometry =
                new THREE.PlaneGeometry(
                    0.4,
                    0.4
                );


            const material =
                new THREE.MeshBasicMaterial({

                    map: texture,

                    transparent: true,

                    side: THREE.DoubleSide

                });


            logoMesh =
                new THREE.Mesh(
                    geometry,
                    material
                );


            logoMesh.visible = false;


            scene.add(logoMesh);

        }

    );


    /* КОНТРОЛЛЕР */

    controller =
        renderer.xr.getController(0);


    controller.addEventListener(
        "select",
        placeLogo
    );


    scene.add(controller);


    /* AR SESSION */

    xrSession =
        await navigator.xr.requestSession(
            "immersive-ar",
            {
                requiredFeatures: [
                    "hit-test"
                ],
                optionalFeatures: [
                    "dom-overlay"
                ],
                domOverlay: {
                    root:
                        document.getElementById(
                            "ar-screen"
                        )
                }
            }
        );


    renderer.xr.setSession(
        xrSession
    );


    xrSession.addEventListener(
        "end",
        function() {

            xrSession = null;

            hitTestSource = null;

            hitTestSourceRequested = false;

            document.getElementById(
                "ar-screen"
            ).style.display = "none";

        }
    );


    renderer.setAnimationLoop(
        renderAR
    );

}


/* =========================
   РАЗМЕСТИТЬ ЛОГОТИП
========================= */

function placeLogo() {

    if (!logoMesh) {
        return;
    }


    if (!logoMesh.visible) {

        logoMesh.visible = true;

    }


    document.getElementById(
        "ar-message"
    ).innerText =
        "Логотип размещён. Наведите камеру и осмотритесь.";


    logoMesh.scale.set(
        1,
        1,
        1
    );

}


/* =========================
   AR РЕНДЕР
========================= */

function renderAR(
    timestamp,
    frame
) {

    if (!frame) {
        return;
    }


    const session =
        renderer.xr.getSession();


    const referenceSpace =
        renderer.xr.getReferenceSpace();


    if (
        !hitTestSourceRequested
    ) {

        session
            .requestReferenceSpace(
                "viewer"
            )
            .then(function(
                referenceSpace
            ) {

                session
                    .requestHitTestSource({
                        space:
                            referenceSpace
                    })
                    .then(function(
                        source
                    ) {

                        hitTestSource =
                            source;

                    });

            });


        session.addEventListener(
            "end",
            function() {

                hitTestSourceRequested =
                    false;

                hitTestSource = null;

            }
        );


        hitTestSourceRequested =
            true;

    }


    if (hitTestSource) {

        const hitTestResults =
            frame.getHitTestResults(
                hitTestSource
            );


        if (
            hitTestResults.length > 0
        ) {

            const hit =
                hitTestResults[0];


            const pose =
                hit.getPose(
                    referenceSpace
                );


            if (
                pose &&
                logoMesh &&
                !logoMesh.visible
            ) {

                document.getElementById(
                    "ar-message"
                ).innerText =
                    "Поверхность найдена. Нажмите на экран.";

            }

        }

    }


    renderer.render(
        scene,
        camera
    );

}


/* =========================
   ЗАКРЫТЬ AR
========================= */

function closeAR() {

    if (xrSession) {

        xrSession.end();

        xrSession = null;

    }


    document.getElementById(
        "ar-screen"
    ).style.display = "none";

}

</script>
