<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AR Визитка</title>

    <script type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
        }

        .header {
            padding: 25px 15px 10px;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
        }

        .header p {
            color: #bbb;
        }

        model-viewer {
            width: 100%;
            height: 500px;
            background: #222;
        }

        .buttons {
            padding: 20px;
        }

        button,
        a {
            display: block;
            width: 100%;
            max-width: 350px;
            margin: 10px auto;
            padding: 16px;
            border-radius: 12px;
            border: none;
            font-size: 17px;
            text-decoration: none;
            cursor: pointer;
        }

        .ar-button {
            background: white;
            color: black;
        }

        .phone {
            background: #25D366;
            color: white;
        }

        .instagram {
            background: #833AB4;
            color: white;
        }

        .info {
            padding: 10px 20px 30px;
            color: #aaa;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Жангелды Аубакир</h1>
        <p>Менеджер по продажам</p>
    </div>

    <model-viewer
        src="car.glb"
        ar
        ar-modes="webxr scene-viewer quick-look"
        camera-controls
        auto-rotate
        shadow-intensity="1"
        exposure="1">

        <button class="ar-button" slot="ar-button">
            🚗 ПОСМОТРЕТЬ В AR
        </button>

    </model-viewer>

    <div class="buttons">

        <a class="phone" href="tel:+77000000000">
            📞 Позвонить
        </a>

        <a class="instagram"
           href="https://instagram.com/"
           target="_blank">
            📷 Instagram
        </a>

    </div>

    <div class="info">
        Наведите камеру телефона на QR-код,
        чтобы открыть AR-визитку.
    </div>

</body>
</html>
